# Jack and the Beanstalk — every piece of prompt text the app sends.
#
# This file is the product. The Python is deliberately thin: it chooses which
# line applies and joins them, but the words themselves live here so they can
# be edited, diffed and reviewed without touching code. Values are looked up
# by the enum values in app/models (e.g. cartoon_style = "western_cartoon" ->
# [styles].western_cartoon). A missing key fails at startup, not at request time.

# The sentence that protects the graded requirement: it must look like the person.
[identity]
directive = "Preserve the identity of the person in the reference image with absolute fidelity: the same bone structure, the same face shape, the same eye shape and eye colour, the same nose, the same mouth, the same eyebrows, the same hairline, the same skin tone and the same distinguishing marks such as moles, freckles, glasses and facial hair. Do not invent a new face. Do not average the face towards a generic look. A person who knows the person in the photo must recognise them immediately."

# Rejects the failure modes that would fight the caption: text and extra people.
[negative]
tail = "Do not include any text, letters, numbers, watermark, signature, logo, caption or speech bubble anywhere in the image — the picture must be a clean illustration with no writing in it. Do not include any other people or characters; only the one person described above. Do not include extra limbs, extra fingers, duplicate faces or distorted hands."
# The standing negative block (AI assessment, "AI artifact avoidance"): the last
# paragraph of every image prompt, portrait, cover and page alike, so the
# classic generator faults are the final thing the model reads.
standing = "AVOID: extra fingers, fused fingers, missing fingers, extra hands, extra arms, malformed hands, deformed face, crossed eyes, blank stare, clipped limbs, objects intersecting, floating objects, cut-off heads, text, letters, watermark, signature, plastic texture, flat lighting."

# Art styles, keyed by CartoonStyle.
[styles]
manga = "black-and-white Japanese manga style, crisp confident ink linework, heavy black outlines, screentone dot shading, dramatic speed lines, high-contrast monochrome, large expressive eyes, hand-drawn manga panel aesthetic"
anime = "modern Japanese anime style, clean cel shading with two-tone shadows, bright saturated colours, soft gradient skies, large sparkling expressive eyes, delicate linework, detailed hair strands, polished studio-anime finish"
western_cartoon = "classic hand-drawn western cartoon style, bold rounded ink outlines, flat blocks of warm colour, simplified friendly shapes, gentle squash-and-stretch, vintage storybook cel animation look"
# The app's default — and the whole book's one fixed style. Written once here
# (the UAT wording) and keyed by name from [stories.<key>].style, so portrait and book
# pages can never drift apart: edit it here, both change together.
pixar_like = "Modern 3D animated feature: rounded sculpted forms, large expressive eyes with real catchlights, soft rim light on the characters, smooth subsurface skin shading, appealing stylised proportions, warm cinematic colour grading, polished family-film design"
disney_like = "classic hand-painted 2D animation style, fluid confident curves, soft painted backgrounds, expressive appealing character design, warm colour, generous rounded shapes, storybook cel animation finish"
comic_book = "American comic book style, heavy black ink outlines, halftone Ben-Day dot shading, flat saturated four-colour palette, dynamic heroic composition, bold panel energy"
pencil_sketch = "graphite pencil sketch, confident cross-hatched shading, visible pencil grain, loose expressive linework on warm off-white paper, monochrome hand-drawn study"
watercolour = "traditional watercolour painting, soft wet-on-wet colour bleeds, visible paper texture, translucent layered washes, loose painterly edges, delicate ink accents"
vector_flat = "flat vector illustration, perfectly smooth geometric shapes, no gradients, no texture, bold clean silhouettes, bright modern palette, minimal scalable-graphics look"

# Composition phrasing, keyed by AspectRatio (the enum value is the ratio).
[aspect_hints]
"1:1" = "square 1:1 composition"
"4:3" = "4:3 landscape composition"
"3:4" = "tall 3:4 portrait composition"
"16:9" = "wide cinematic 16:9 composition"

# Apparent age, keyed by ApparentAge.
[ages]
as_uploaded = "Keep the subject at the same apparent age as in the photo."
child = "Depict the subject as a child around 10 years old."
teen = "Depict the subject as a teenager around 16 years old."
adult = "Depict the subject as a grown adult around 30 years old."

# Which gender the AI should draw, keyed by CharacterGender.
[genders]
match = "Keep the character's gender the same as the person in the photograph."
boy = "Present the character unmistakably as a boy, keeping the facial bone structure from the photo."
girl = "Present the character unmistakably as a girl, keeping the facial bone structure from the photo."

# Pronouns, keyed by PhotoGender, substituted into the scene prose so a girl is
# never called "him".
[pronouns.boy]
subject = "he"
object = "him"
possessive = "his"
reflexive = "himself"

[pronouns.girl]
subject = "she"
object = "her"
possessive = "her"
reflexive = "herself"

# Skin tone, keyed by SkinTone.
[skins]
as_uploaded = "Keep the exact natural skin tone from the photo."
very_light = "Render the skin very light and fair."
light = "Render the skin light and fair."
medium = "Render the skin a medium beige tone."
tan = "Render the skin warm and tanned."
olive = "Render the skin an olive tone."
brown = "Render the skin a rich brown tone."
deep_brown = "Render the skin a deep brown tone."
deepest_brown = "Render the skin the deepest rich brown tone."

# Outfit, keyed by Outfit.
[outfits]
as_uploaded = "Wear the same clothing as in the photograph, redesigned in the art style of the image."
storybook_tunic = "Wearing a classic storybook outfit: a loose linen shirt, a muted green wool tunic belted with a plain leather belt, brown breeches and soft brown leather ankle boots."
peasant = "Wearing rough, patched peasant clothes: an undyed linen shirt, a brown wool vest, patched brown trousers held up by a rope belt, and worn leather shoes."
adventurer = "Wearing an adventurer's outfit: a rust-red tunic over a cream shirt, a leather belt, a leather shoulder strap across the chest, dark trousers and brown leather boots."
simple_shirt = "Wearing a plain shirt, plain trousers and simple brown shoes."
hooded_cloak = "Wearing a hooded travelling cloak over a plain tunic and trousers, with brown leather boots, the hood down so the face and hair are fully visible."
none_specified = "Wearing simple, unremarkable clothing that does not draw attention."

# Hair style, keyed by HairStyle.
[hair_styles]
as_uploaded = "Keep the hairstyle exactly as in the photograph: the same texture (straight, wavy, curly or coiled), the same colour, the same length and the same parting."
short = "Short, cropped hair."
bob = "A chin-length bob."
long_straight = "Long, straight hair falling past the shoulders."
long_wavy = "Long, wavy hair falling past the shoulders."
curly = "Defined curly hair."
coily = "Tight coiled hair."
ponytail = "Hair pulled back into a ponytail."
buns = "Hair gathered into buns."
bald = "A bald scalp, with no hair."

# Hair colour, keyed by HairColour.
[hair_colours]
as_uploaded = "Keep the exact hair colour from the photograph."
black = "Black hair."
dark_brown = "Dark brown hair."
brown = "Brown hair."
auburn = "Auburn hair."
red = "Red hair."
blonde = "Blonde hair."
platinum = "Platinum blonde hair."
grey = "Grey hair."
white = "White hair."

# Expression, keyed by Expression.
[expressions]
as_uploaded = "Keep the expression from the photograph."
focused_determined = "A focused, determined expression."
happy = "A warm, happy expression."
serious = "A serious, level expression."
surprised = "A surprised expression with raised eyebrows."
curious = "A curious, attentive expression."
brave = "A brave, resolute expression."
worried = "A worried expression with slightly drawn brows."
grinning = "A broad grin showing teeth."

# Portrait background (portrait pass only), keyed by PortraitBackground.
[portrait_backgrounds]
plain = "BACKGROUND: plain and quiet — an even, untextured field of a single soft neutral tone. Nothing behind the head, no objects, no pattern, no horizon line, no vignette. The face is the only thing in the picture that matters."
as_uploaded = "BACKGROUND: keep the background of the original photograph, simplified into the art style but recognisably the same place. Keep the face and hairline clearly separated from it."
soft_colour = "BACKGROUND: a soft, out-of-focus wash of one muted colour with a gentle gradient. Nothing in it is in focus and nothing is in it is a shape."
storybook = "BACKGROUND: a hand-painted storybook backdrop — soft rolling hills, a few distant stylised trees and a warm painted sky, all low-contrast and clearly behind the figure, leaving the face unobstructed."

# How hard to hold the face, keyed by LikenessStrength.
[likeness]
strict = "Match the uploaded face as precisely as a photograph would. Small deviations in the eyes, nose, jaw or hairline are failures, not interpretation."
balanced = "Match the uploaded face closely while allowing small stylised departures."
loose = "Keep the uploaded face recognisable, letting the art style shape it somewhat more."

# The cartoon-vs-real dial, one entry per step from 1 to 10.
[intensity]
"1" = "barely stylised: keep the photograph almost intact, adding only delicate line work over the eyes and a very light ink trace on the contours"
"2" = "very lightly stylised: retain photographic shading and texture, with soft ink lines defining the eyes, brows and jaw"
"3" = "lightly stylised: photographic likeness with visible outline lines and slightly simplified facial shapes"
"4" = "moderately stylised: painterly realism with clear outlines and gently simplified features, still unmistakably the same person"
"5" = "about half stylised: an even balance between realistic rendering and cartoon simplification, with clean outlines and simplified shapes"
"6" = "clearly stylised: unmistakable cartoon rendering, but the facial structure and every identifying feature are still faithful to the photo"
"7" = "strongly stylised: bold cartoon shapes and confident outlines, with the face still unmistakably the person in the photo"
"8" = "very strongly stylised: graphic cartoon shapes, heavy clean outlines and flat colour, while the face remains instantly recognisable as the same person"
"9" = "almost entirely graphic: bold flat shapes and thick outlines, the design reads as a caricature that a friend would still identify without hesitation"
"10" = "fully graphic: maximally simplified bold shapes, thick outlines and flat poster colour, reduced to the most iconic version of this specific person's face"

# Suppress photorealism as the dial turns up (bands: 1-3 none, 4-5 soft, 6-10 strong).
[photoreal]
soft = "Avoid heavy simplification of the face; keep features readable."
strong = "Simplify boldly and graphically. Do not fall back towards photographic rendering or 3D realism."

# Whether real-world glasses / facial hair carry into the cartoon.
[accessories]
keep_glasses = "If the person in the photo wears glasses, keep those glasses on the character, drawn in the same style as the rest of the image."
remove_glasses = "Remove any glasses or sunglasses."
keep_facial_hair = "If the person has facial hair, keep it, drawn in the same style as the rest of the image."
remove_facial_hair = "Remove any facial hair."

# Corrective clauses for the portrait retry step. Closed-set feedback for the
# review stage (UAT: "a button to report feedback to the model on the cartoon"):
# every possible answer is fixed, reviewed text, so no visitor wording ever
# reaches a prompt. Keyed by RejectionReason.
[rejections]
face_changed = "The previous attempt did not look like the person. Identity outranks style this time: reproduce the reference's proportions exactly — the skull shape, jaw width, distance between the eyes, size and angle of the nose, mouth width and lip shape, brow thickness, forehead height and hairline — and resist any stylisation that would alter them."
style_wrong = "The previous attempt was in the wrong art style. Follow the ART STYLE section exactly this time, in its medium, line weight and shading."
age_wrong = "The previous attempt's age read wrong. Follow the stated age precisely in face shape, proportions and skin."
hair_wrong = "The previous attempt's hair was wrong. Follow the stated hair style, length, part and colour exactly."
skin_tone_wrong = "The previous attempt's skin tone was wrong. Match the stated tone exactly, including any warmth or undertone."
expression_wrong = "The previous attempt's expression was wrong. Read the stated expression literally and change the brows, eyelids and mouth accordingly."
outfit_wrong = "The previous attempt's clothing was wrong. Wear exactly the stated outfit, and keep it readable against the background."
background_distracting = "The previous attempt's background competed with the face. Put nothing behind the head: no objects, no pattern, no strong colour. Keep the whole face unobstructed and clearly lit."
too_cartoon = "The previous attempt was over-stylised and lost the person. Pull back towards a realistic rendering while keeping light outlines."
not_cartoon_enough = "The previous attempt looked like a photograph rather than a cartoon. Commit harder to the art style: visible outlines and simplified shapes."
# The visitor could not name what was wrong, and the rejected image is
# deliberately never sent back as a reference (showing it invites the model to
# converge on its faults). "Be different from an image you cannot see" was
# therefore a plain re-roll with the same prompt; this names the axes to vary
# instead, and leaves identity alone.
no_specific_fault = "The previous attempt was rejected without a named fault, so change what is visible rather than guess at the fault: vary the shoulder line and the body's angle, the pose of the arms, what sits behind the head and the direction of the light — while keeping the framing, the face, the hair and the outfit exactly as specified."

# Fixed scaffolding around the variable parts. {braces} are filled at build time.
[assembly]
task_cartoon = "TASK: Turn the person in the supplied photograph into a single character portrait, in the art style described below."
task_scene = "TASK: Draw the character from the reference images as {name}, performing the scene specified below. The reference images are the same person: the first is their cartoon portrait, the second is their original photograph."
character_name = "The character's name is {name}. Use {subject} / {object} / {possessive} pronouns for this character throughout; never use pronouns of a different gender."
framing = "FRAMING: a head-and-shoulders portrait facing the camera, head and face large and unobstructed in the centre of the frame, eyes fully visible and not hidden by hair or shadow, even flattering light on the face so every feature reads clearly."
stylisation = "STYLISATION LEVEL (user setting, honour it exactly): {intensity}."
art_style = "ART STYLE: {style}."
composition = "COMPOSITION: {aspect}."
scene_to_draw = "SCENE TO DRAW (this is the entire content of the picture): {caption}"
character_doing = "WHAT THE CHARACTER IS DOING: {action}. Get this action right — it is what the scene is about."
# The portrait pass for a photographed cast member. Unlike task_cartoon, it
# never names the book's child: the mother's portrait must not be drawn as a
# second Jack. The role text is the character's `portrait` in the story's bible.
task_cast_portrait = "TASK: Turn the person in the supplied photograph into a single cartoon character portrait of one character from this picture book, drawn in the book's own fixed art style. The photograph is the authority on their face, their apparent age, their colouring, their hair and any glasses, head covering or facial hair; the character description below says only who they play in the story and what costume they wear. Draw exactly this one person — never the book's child, and never anyone else's face."
where = "WHERE: {environment}."
lighting = "LIGHTING: {time_of_day}."
camera = "CAMERA: {camera}."
checklist = "Every one of these must be clearly visible: {items}."
avoid = "Do not show any of the following: {items}."
# Prefaced to the portrait-retry prompt only when the user ticked reasons; the
# retry is otherwise byte-identical to a first attempt.
rejection_preamble = "This is a retry. The previous attempt was rejected, so do not reproduce it."
# ---------------------------------------------------------------------------
# The picture book.
#
# The book is a separate product inside the same app: same child, several pages
# in sequence, one PDF. Three rules from the brief that this data enforces:
#
# 1. The style sentence is FIXED. Every page prompt in a book repeats its
#    story's style ([stories.<key>].style) word for word — never varied across
#    pages, never replaced by the single-scene style pick.
# 2. The model never draws story text. The story line ("prose") is drawn onto
#    the page by the PDF layer only; the prompt says so explicitly.
# 3. Nothing here belongs to one tale. A story's words, scenes and cast live in
#    its seed (app/books/<key>.toml); its props, places and own rules live in
#    [stories.<key>] at the end of this file.
# ---------------------------------------------------------------------------

[book]
# The child's wardrobe lock (AI assessment: dropped accessories, a shirt that
# changed style, a satchel that came and went). The outfit itself is the
# visitor's pick, written out garment by garment in [outfits]; this line makes
# every garment mandatory and forbids silent omissions.
same_clothes = "The child wears exactly the same clothes on every page of this book: the complete outfit stated below — every garment, the under-layers, the belt, the footwear, any headwear and every accessory — and every item of it is drawn whenever that part of the body is in view. No item is omitted, swapped, restyled or recoloured, and nothing changes unless the story says so. Anything a character carries belongs to the scenes the story gives it: if a strap shows, whatever hangs from it shows too, and nothing vanishes and reappears between pages."
# Cross-page consistency (UAT: "the cow changes colours between pictures"). Every
# character of every kind is one persistent being across the book — pose, angle
# and distance may change, identity may not.
same_characters = "Every character in this book — person, animal or object — is exactly the same character on every page: the same colours, proportions, clothing and distinguishing features from page to page. A page may change a pose, a camera angle or a distance, never the identity of who or what a character is; characters remain the same across the book the way real people, real animals and real things do."
# Age lock (AI assessment: the boy's face looked too old on some pages and too
# young on others; a child must never grow a beard or grey hair). Book-level,
# so it is byte-identical on every page of one book.
same_age = "{name} has exactly the same apparent age on every page — never older, never younger from one page to the next. When {name} is a child, {subject} reads as that age in every picture: childlike head-to-body proportions, a round young face, short limbs, no adult or teenage features, no beard or stubble, and no grey or white hair."
# Signature accessories (AI assessment: glasses drifting between thin wire,
# dark round and bright plastic; a kippah that vanished or morphed into a
# beret; a headscarf that changed colour and let hair escape). The cartoon
# portrait is the authority, so a visitor who removed the glasses there is
# honoured here too.
signature_features = "SIGNATURE FEATURES: glasses, a head covering (such as a kippah, cap, hat or headscarf) and facial hair, as drawn in a character's cartoon portrait, are part of who that character is. Each is drawn on every page that character appears on, exactly as in the portrait: glasses keep one frame shape, one frame colour and one frame thickness; a head covering keeps its shape, its colour, its pattern or plainness, its size and the way it is worn, and is never swapped for a beret, a skullcap or a different hat — it stays on even when the outfit is period costume; hair tucked under a covering stays tucked, with no loose strands or bangs; a beard keeps its colour, fullness and length. A missing or changed signature feature is a failure."
# What the likeness dial MEANS on book pages (UAT round 2: the child's face
# kept coming back slightly bloated on wide shots). The user's likeness
# sentence demands photographic precision; at doorway distance that demand has
# only one physical reading — draw the face big. This line redefines it instead
# of removing the dial: likeness is feature-shape, verifiable zoomed in, and
# never a licence to grow the head. It is carried immediately after the user's
# likeness sentence and directly above body_coherence, so dial, meaning and
# order of precedence read as one contract.
likeness_not_size = "The likeness rules above describe what the face looks like — its features, shapes and colours when examined up close — never how large the face appears in the frame. A face drawn small at its true distance is still faithful when it is correct zoomed in: recognisability lives in the features, not in the size, and no likeness rule, however strict, licenses an enlarged head, an oversized face or a closer crop. Body proportions come first: a bobblehead is always a failure, and outranks every likeness consideration; a small, simple, correctly proportioned face is never one."
# Whole-body coherence (UAT: "the character's face is grotesquely big — like a
# bobblehead — in one scene"). A guard line on every page prompt. The second
# sentence makes the likeness rules distance-aware: at distance, silhouette,
# hair and clothes carry the likeness.
body_coherence = "The child is one coherent figure at natural storybook proportions: a natural head-to-body ratio in every scene, the head never enlarged for the frame, with no oversized faces and no bobblehead proportions anywhere in the book. The likeness rules apply at the scene's own camera distance: at wide-shot and long-shot distances the likeness is carried by the silhouette, the hair, the clothing and their colours, while the face is drawn small and simplified in true scale — the head is never enlarged, never brought closer to the camera and never turned into a partial close-up just to show the face better."
# One art style for the whole scene (UAT: "the whole scene is drawn in the same
# cartoon style"). Characters, background, props and environment in a single
# medium — no mixed media within a page.
one_art_style = "Draw the entire scene — character, animals, background, props and environment — in exactly the one art style stated for this book: the same medium, line weight, shading and finish everywhere. Mix no styles: nothing photorealistic, painterly, sketched or flat beside a 3D-rendered figure."
# Physics, actions and materials (AI assessment: a body falling sideways into
# the sky, a floating harp, an axe that missed the trunk, a child running away
# from the landmark he was running to, plastic-looking coins and bread). The
# tale-specific examples are each story's own page_rules.
physics = "THE WORLD WORKS: everything obeys gravity — a thrown thing travels in a downward arc, nothing floats unsupported in mid-air, and anything that falls falls down towards the ground. Hands that hold something grip it, fingers wrapped round it; a tool in use touches what it is working on. A character running towards something faces it and moves towards it; a character leaving something moves away from it. Bodies and objects never pass through one another: no arm merging into clothing, no utensil behind the hand that holds it. Everything is made of its real material — wood, iron, stone, leather, linen, wool, straw, real bread — and nothing looks like plastic. Sizes are sane: nothing a child carries is heavier than a child could carry."
# Expression, light and the book's colour grade (AI assessment: a neutral smile
# on a wonder beat, time of day jumping back and forth, facing pages that
# looked like two different films, the same frozen pose for every giant scene).
mood_and_light = "MOOD AND LIGHT: every face shows the EMOTIONAL BEAT stated for its page, plainly and in the whole body — fear is wide eyes and an open mouth, wonder is wide-eyed amazement, joy is a real laugh — never a stock neutral smile. The pages are colour-graded as one book: the same palette family, saturation and contrast from page to page, changing only with the time of day the page names. Light comes from a source the scene shows or implies, from one consistent direction, and every cast shadow agrees with it. Each scene is staged afresh for its own moment — never the same frozen pose, seat, angle and framing as another page."
# The model must not imitate the story text: the PDF draws it.
no_text = "Do not draw any text, lettering, numbers, watermark, signature, logo, caption or speech bubble anywhere in the image — the page's story text is added later, outside this image, so any writing you draw would be doubled up and garbled."
# The book's negative tail, replacing the single-scene tail on book pages only
# (UAT round 2: the mother wore the child's face). The tail declares the cast
# instead: each reference face belongs to its own character, and a character
# without one is invented. A story's own face rules (Jack's giant is never a
# larger old man) are its [stories.<key>].page_rules.
negative = "Every person is drawn with exactly two arms and two legs, and every animal with its own natural number of legs: no fifth limb, no extra, fused, doubled or duplicated limbs, no extra fingers, no distorted hands, no duplicate faces. Every hand has exactly five fingers, clearly separated and correctly jointed — none fused, webbed, truncated or extra — and an unnatural skin colour on a hand is a failure. Eyes are in focus, matching and expressive, never vacant or crossed. No stray contour lines, seams or panel lines across faces, bodies, clothes or animals. The page shows exactly the characters its scene names and no others, and nothing borrowed from another page of the book. Every reference image in this prompt belongs to the character it is labelled for, and no reference face may ever be moved onto a different character — not the child's face onto anyone else, and not another character's face onto the child or onto a third character. No two characters share a face. A character with no reference image is a different person entirely — a different age, different bone structure, nothing borrowed from the photograph or from the child — drawn to the cast description given in this prompt, and the child's face is never placed on any other character."

# The dial's wording on book pages, band by band. Each line stays inside the
# book's fixed style and moves only how graphic the rendering is, so any level
# is a legal instruction beside `one_art_style`. Levels map to the portrait
# dial's own 1–10 scale: a visitor who picked 3 for the portrait gets the 3 here.
[book.intensity]
"1" = "the most literal rendering inside that one medium: simple softly shaded forms, the faintest line work, no exaggeration anywhere"
"2" = "very restrained inside that medium: simple rounded forms, gentle shading, thin clean outlines"
"3" = "restrained inside that medium: clean visible outlines and lightly simplified facial shapes, still fully modelled and softly shaded"
"4" = "moderately graphic inside that medium: stronger outlines, flatter shading, gently simplified features"
"5" = "half way towards graphic inside that medium: crisp bold outlines and simplified shapes, balanced with the medium's modelling"
"6" = "clearly graphic inside that medium: bold outlines, simplified shapes and flatter areas of colour over the medium's modelling"
"7" = "strongly graphic inside that medium: heavy clean outlines, large simple shapes, minimal shading"
"8" = "very strongly graphic inside that medium: thick outlines, flat colour blocks, the most poster-like the medium allows"
"9" = "almost entirely graphic inside that medium: bold flat shapes and thick outlines, almost no modelling"
"10" = "fully graphic inside that medium: maximally simplified bold shapes, thick outlines and flat poster colour, reduced to the medium's most iconic forms"

# PDF-layer copy for the cover and the About page. These strings never reach
# the model. The About page is composed of real sentences (AI assessment: bare
# "7 years old / Eli Belly / Eli is very cute!" lines read as leaked authoring
# notes). {about_name} and the rest are filled from what the uploader typed.
[book.about]
heading = "About {about_name}"
star_line = "This book stars {about_name}."
age_line = "{about_name} is {age_phrase}."
title_line = "In real life, {about_name} is {title_phrase}."
closing = "The End"
# The cover's credit line, under the title.
credit = "A story for {about_name}"

# Per-page scaffolding.
[book.assembly]
task = "TASK: Draw page {page_number} of {total_pages} of the picture book \"{book_title}\". Every page of the book shows the same child character: {name}. The reference images are the same person: the first is their cartoon portrait, the second is their original photograph."
# The cover is one extra call, made before the story pages, from the story's
# own cover scene. The title itself is never drawn by the model (the PDF adds
# it as real text), so the prompt asks for a calm title band instead.
cover_task = "TASK: Draw the COVER ILLUSTRATION for the picture book \"{book_title}\". The cover stars the same child as every page of the book: {name}. The reference images are the same person: the first is their cartoon portrait, the second is their original photograph. This is the book's front cover, not a story page."
cover_band = "THE TITLE BAND: leave the upper third of the picture calm and uncluttered — a simple sky or a quiet background with no important faces or objects there — because the book's title is added afterwards, outside this image. Draw no lettering, title or writing of any kind anywhere."
# The whole story, one labelled line per page, so the model knows which line it
# is illustrating and what the other lines mean. {story_lines} is built from the
# pages' own `beat` text, so the story is stated once in the catalogue.
story_context = "THE WHOLE STORY (context for you only):\n{story_lines}\n\nYou are illustrating one page of this story: page {page_number} of {total_pages}. Your picture must show exactly what page {page_number}'s line says — its events, its characters, and how many of each thing there are — and must not contradict that line in any way. The other pages' lines are here only so that you understand the story you are drawing; do not draw their scenes, their characters, their objects or their settings. Draw only what your own page's scene names, and nothing that belongs to another page of the book. Draw what your line means, never its lettering: the page's words are printed beside the picture afterwards, outside the image."
page_identity = "PAGE IDENTITY: this child is the single recurring character across all pages of this book — the same face, the same hair, the same clothes as every other page."
# The intensity dial as book pages read it (see [book.intensity]).
stylisation = "STYLISATION LEVEL (user setting, applied inside the book's ONE fixed art style): {intensity}. This dial never selects the medium: the whole scene is drawn in the art style stated for this book, at every level. The level only decides how graphic the outlines are and how far the forms are simplified, from literal and softly modelled at the low end to bold flat shapes at the high end. Never photographic, never painterly, never a sketch, never mixed media — whatever the level."
# The text half of the character bible: the same block, byte for byte, on every
# page of a book. The reference-photo note is book-level on purpose.
cast_sheet = "THE CAST (the same characters on every page of this book; this page draws only the characters its own scene names, and no others):\n{cast_looks}\n{photo_note}"
cast_photos = "SUPPLIED PHOTOS: the uploader supplied reference photos for {names}. Those belong to those characters alone; every other character is drawn from the description above."
cast_photos_none = "SUPPLIED PHOTOS: none. Every character other than the child is drawn from the description above."
# The per-page reference order, matching the reference images exactly as they
# are sent with this call.
reference_images = "REFERENCE IMAGES (in the order supplied): {entries}. Each image belongs only to the character it is named for."
# The page's feeling (AI assessment: "expression tracks the story beat").
emotion = "EMOTIONAL BEAT: {emotion}."
# The whole frame is the picture: the story text is printed in a margin below
# the art, never over it, so nothing in the frame has to be kept empty for it.
full_frame = "FRAME: the whole image is the illustration, edge to edge. No part of it is covered by text afterwards, so compose the full frame, with no empty band left for words."

# ---------------------------------------------------------------------------
# The empty plates (T5).
#
# A plate is one page's world painted once, with no people and no text, which
# an approved edit pass later paints the characters into. Everything here is
# fixed book data: no user text, no child, no real person, no brand. Each
# story section drives all 21 of its plates from the same world, palette and
# forbid-lists, so the set reads as one book.
# ---------------------------------------------------------------------------

[stories.jack_and_the_beanstalk]
style = "pixar_like"
intro = "TASK: Paint one EMPTY background plate for a page of this picture book: the place, the props and the light the page happens in, with nobody in it. This is not a finished page — a later pass paints the characters into it — so the frame must be a clean, uncluttered stage with one clear patch of ground or floor where a character will stand, and nothing occupying it."
world = "THE PLACES AND PROPS (fixed designs, drawn the same way whenever they appear): a small single-storey cottage of grey fieldstone under a golden thatched roof, a stone chimney at its left end, one square window with a wooden shutter, a weathered blue-green plank door with an iron handle and a stone step, a vegetable garden in front and a low picket fence with a gate, standing alone at the end of a dirt lane; Milky-White, the family's cow, drawn wherever a place names her standing in it — a plain white dairy cow with a calm, gentle face, a soft pink muzzle, small short horns and a long tufted tail, never a person, never a cartoon face and never any other colour; its kitchen with the stone hearth and hanging copper pots on the left wall, the worn oak table with two stools in the middle, open shelves and a cupboard on the back wall and the window on the right; the dusty dirt road to market, running away between green fields and a hedgerow; the vegetable garden with a path of flat stones and a ring of grey fieldstones where the beanstalk grows, and the flat stump it leaves behind; the beanstalk — one twisting green stalk as thick as an old oak trunk, with broad heart-shaped leaves, rising out of the stone ring and up through the clouds; the cloud country — rolling white cloud-banks firm enough to walk on, with a pale stone path crossing them; the castle — grey stone with exactly three round towers with pointed slate roofs, the tallest in the middle, and one great arched wooden door; the giant's kitchen — a vast stone hall built to giant size, with the towering hearth and giant iron pots on the left wall, the great oak table in the middle with a high-backed chair on its near side, a wooden perch over a nest of straw in the right-hand corner, the great door in the right wall and one high, narrow window."
palette = "ONE PALETTE FOR THE WHOLE BOOK: warm storybook colours — honey gold, sage and deep forest green, weathered stone grey, cream and soft sky blue — at the same saturation and contrast from the cover to the last page. Only the time of day changes across the set: pale gold morning, clear midday, warm evening, blue-violet dusk, then a deep blue night lit by warm lamplight."
empty = "THE PLATE IS EMPTY OF PEOPLE: no people at all — no child, no grown-up, no crowd of any size, no silhouettes of people, no figures at the edges of the frame, no face, no hand, no foot. The giant is a character and is never in a plate, and nobody is holding anything: no beans in a palm, no rope, no purse hugged in a pair of arms, no axe in a hand. The plain white cow, the plump brown hen and the golden harp belong to the places they stand in, not to the cast: a plate draws one of them only where its own place names it, in exactly the one look the places and props give it, and leaves it out everywhere else. The perch and the straw under it are part of the giant's kitchen."
no_text = "NO TEXT OF ANY KIND: no lettering, no signage, no captions, no logos, no labels, no numbers, no speech bubbles, no shop signs, no writing on any wall, page, banner or object, and no letter-like marks anywhere in the frame."
negative = "Do not draw: a busy or cluttered composition, a close-up of a face, a person's reflection in a window or a mirror, a decorative border or frame, a watermark, a signature, a photograph, a plastic or 3D-render look, or anything frightening for a young child."

# The finished page's own props-and-places sheet, pasted whole into every page
# and the cover, and the rules this tale adds to the shared book rules.
page_world = """THE PROPS AND PLACES (fixed designs: whenever one appears it is drawn exactly like this, at this size and in this arrangement, on every page):
- The five beans: five large kidney-shaped beans that are real seeds with natural mottled skins — one speckled red, one blue-grey, one deep green, one golden-tan, one dark violet — ordinary beans with no glow, no halo and no light of their own; never translucent, neon or sweet-like.
- The cottage: one small single-storey cottage with grey fieldstone walls under a golden thatched roof, a stone chimney at its left end, one square window with a wooden shutter to the left of the door, a weathered blue-green plank door with iron hinges on its left edge, an iron ring handle on its right edge and an iron knocker on its outside face, a stone doorstep, a vegetable garden in front and a low wooden picket fence with a gate. It stands alone at the end of a dirt lane, the village rooftops small and far off down the lane to the right.
- The cottage kitchen: one room, always arranged the same way: the stone hearth with hanging copper pots of ordinary size on the left wall, the worn oak table with two stools in the middle, open wooden shelves and a cupboard on the back wall, the window on the right wall.
- The road to market leads away to the right of the cottage: going to market is always moving towards the right of the frame, coming home is always moving towards the left.
- The beanstalk: one twisting green stalk as thick as an old oak trunk — wider than the cottage door — with broad heart-shaped leaves, rising from the garden to the right of the cottage out of a low ring of grey fieldstones. After it is cut, a broad flat cut stump stays inside that stone ring.
- The cloud country: rolling white cloud-banks firm enough to walk on, the top of the beanstalk at the right-hand side, the castle far across the plain to the left.
- The castle: one grey stone castle with exactly three round towers with pointed slate roofs, the tallest in the middle, and a great arched wooden door; never more towers, never fewer.
- The giant's kitchen: a vast stone hall, always arranged the same way: the towering hearth with giant iron pots on the left wall, the great oak table in the middle with the giant's high-backed chair on its near side, a wooden perch over a nest of straw in the right-hand corner, the great door in the right wall, one high narrow window. Everything is built to the giant's size: the tabletop is far above the child's head, the chair seat is higher than the child, and when the giant sits, his legs are under the table.
- The giant's gold: a small round leather drawstring purse about the size of a loaf of bread, tied shut, heavy with gold coins inside it — a child carries it hugged in both arms, leaning back with the effort; loose coins are flat round gold coins that lie flat where they fall.
- The giant's spoon: one bowl at one end and one plain handle at the other.
- The hen: a real, realistic plump brown farm hen with golden-brown feathers, a bright red comb and natural yellow scaly legs with three forward toes and one back toe; never toy-like.
- The golden eggs: the size of an ordinary hen's egg, solid shining gold.
- The harp: a small golden lap harp about as tall as the child's body from shoulders to waist, with silver strings and a brown leather carrying strap; it sings by itself and nobody plays it. Once {name} has it, {subject} carries it on {possessive} back by that strap.
- The axe: an old garden axe with a worn wooden handle about as long as the child's arm and a single grey iron head.
- Milky-White: Milky-White is the family's cow, and she is an animal: an ordinary white dairy cow with a calm, gentle face, a soft pink muzzle, small short horns and a long tufted tail — the same plain white cow, unchanged, on every page she appears. She is never drawn with human features, clothes, hands or a human face."""
page_rules = ["Milky-White the cow is the same white cow everywhere she appears: a plain white coat, unchanged from page to page, at whatever distance the scene shows her.", "The giant is never a larger copy of the old man: a different age, a different face, a different beard and a different build.", "In this tale the world works the same way: a climber's hands grip the beanstalk, the axe blade bites into the trunk it is cutting, no hand sinks into the harp's strings, no coins pass through the purse, and the gold is real gold."]

