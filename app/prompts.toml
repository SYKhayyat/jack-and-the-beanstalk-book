# ---------------------------------------------------------------------------
# The reviewer (T9 tier 2). A vision model looks at every finished picture and
# answers a short checklist. It never sees the child's photograph, their name or
# the About text: a reviewer that is shown "this should look like Emma" is being
# invited to be polite about it, and the About text is none of its business.
#
# The answer is strict JSON, because a reviewer whose output has to be parsed
# out of prose is a reviewer that silently returns "passed" whenever the model
# gets chatty.
# ---------------------------------------------------------------------------

[review]
# The whole instruction, once per image. {page_title}, {story_line} and
# {cast} are filled from the page being checked. The text goes through
# str.format, so a literal brace (the JSON example) must be doubled.
instruction = """You are checking one picture for a children's picture book before it is shown to a child. Judge it the way a careful parent would on a first look at the page: does it show this moment, with the right people, drawn properly, with nothing wrong that a parent or child would notice? Be strict about those; do not hunt for small details.

You are given the picture and a description of the picture it is supposed to be. You are NOT given the child's photograph and you must not guess at likeness — another check covers that.

Answer about this page: "{page_title}". The picture it must be: {story_line}
{cast}

Report exactly one JSON object and nothing else, in this shape:
{{"passed": true, "score": 0, "faults": [], "note": "what is wrong and where"}}

"score" is 0-100: how well the picture shows the moment. "faults" is a list drawn only from these names, and is empty when nothing is wrong:
- "wrong_moment": the picture does not show the described moment — the wrong action, the wrong place, or the characters doing something else
- "missing_character": someone the description says is in the picture is not there
- "extra_person": someone is present whom neither the description nor the list above names
- "text_in_image": any lettering, sign, caption, label, number, speech bubble or writing of any kind
- "face_obscured": a face is hidden, cut off at the frame edge, or turned away in a way that loses the character
- "frightening": blood, a wound, a weapon being used or pointed at someone, an attack in progress, or a child shown in real terror. A tool lying about, or used for the job the description says (an axe chopping a tree), is not a weapon. The story's villain (a wolf, a giant) may look sly, cross or toothy in a friendly cartoon way; that alone is not frightening
- "wrong_counts": a number the description states and the story depends on (five beans, three bears) is clearly wrong
- "deformed": extra or missing limbs, extra fingers, fused hands, doubled feet, or a body that reads as broken, legs or a body passing through a chair, table or other solid object, a figure wedged under a table instead of beside it, or a figure floating in the air with nothing holding it
- "collage": more than one picture in the frame — a grid of tiles, panels, a storyboard, a character sheet, or the same person shown more than once
- "other": something else a parent would notice that makes this a bad page; say what in the note

Small details are NOT faults: what exactly is inside a basket, how many cups or flowers there are, which way a tail points, the exact colour of a prop, or a piece of furniture the description mentions in passing. Do not list them.

"note" is read by the artist who redraws the picture, so make it something they can act on: for every fault, say exactly what is wrong and where in the frame — "a second girl in a red cloak stands at the far right", "the word MARKET is painted on the cart's side", "the grandmother is not in the picture; she should be in the bed", "the picture is a grid of twelve small tiles". Name things by what they look like, never by a guess at who the child is. At most three sentences. When nothing is wrong, one short sentence saying so.

Set "passed" to false if any fault other than "wrong_counts" or "other" is listed, or the score is below 70."""

page_title = "the picture book's page: "
