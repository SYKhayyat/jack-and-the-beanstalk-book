<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A child in a red hood on a path through the woods, with a circle where the face goes">
  <rect width="400" height="300" fill="#e7f1df"/>
  <!-- far trees -->
  <g fill="#a9cba0">
    <path d="M20 200 L50 110 L80 200z"/><path d="M70 200 L104 96 L138 200z"/>
    <path d="M262 200 L296 100 L330 200z"/><path d="M318 200 L350 116 L382 200z"/>
  </g>
  <!-- near trees -->
  <g fill="#5f9a62">
    <path d="M-10 250 L34 120 L78 250z"/>
    <path d="M330 250 L372 128 L414 250z"/>
  </g>
  <rect x="28" y="246" width="12" height="20" fill="#7a5638"/>
  <rect x="366" y="246" width="12" height="20" fill="#7a5638"/>
  <!-- ground and path -->
  <path d="M0 236 Q200 214 400 236 V300 H0z" fill="#8cc79a"/>
  <path d="M168 300 Q190 262 214 240 Q236 226 268 220 L280 224 Q250 236 236 252 Q216 274 232 300z" fill="#e9d6b0"/>
  <!-- grandmother's cottage, far off -->
  <g transform="translate(276 186)">
    <rect x="0" y="16" width="40" height="28" fill="#f4e7cf" stroke="#b8a888" stroke-width="2"/>
    <path d="M-6 18 L20 0 L46 18z" fill="#b5523f"/>
    <rect x="16" y="28" width="9" height="16" fill="#7a5638"/>
  </g>
  <!-- the wolf's eyes in the trees -->
  <g fill="#f2a63b">
    <ellipse cx="96" cy="196" rx="4" ry="2.5"/><ellipse cx="108" cy="196" rx="4" ry="2.5"/>
  </g>
  <!-- the star: red hood, face-shaped hole -->
  <g transform="translate(184 150)">
    <path d="M-34 124 L-24 50 Q0 36 24 50 L34 124z" fill="#c8323f"/>
    <path d="M-36 30 Q-36 -16 0 -18 Q36 -16 36 30 L30 60 Q0 46 -30 60z" fill="#c8323f"/>
    <path d="M-22 64 L-40 96" stroke="#c8323f" stroke-width="10" stroke-linecap="round"/>
    <!-- basket -->
    <path d="M28 70 Q44 52 60 70" fill="none" stroke="#8a6234" stroke-width="4"/>
    <path d="M24 70 H64 L58 92 H30z" fill="#b8874a" stroke="#8a6234" stroke-width="2"/>
    <rect x="-22" y="118" width="16" height="8" rx="3" fill="#3b2a1e"/>
    <rect x="6" y="118" width="16" height="8" rx="3" fill="#3b2a1e"/>
    <circle cx="0" cy="22" r="24" fill="#fff"/>
    <circle cx="0" cy="22" r="24" fill="none" stroke="#f2a63b" stroke-width="4" stroke-dasharray="7 6"/>
  </g>
  <g fill="#fff" opacity="0.9">
    <circle cx="140" cy="262" r="4"/><circle cx="148" cy="270" r="3"/><circle cx="300" cy="270" r="4"/>
  </g>
</svg>
