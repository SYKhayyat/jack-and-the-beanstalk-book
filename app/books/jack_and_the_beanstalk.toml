cast = []
caption = "By sunrise the beanstalk had grown all the way to the clouds. An enormous green beanstalk, as thick as an old oak trunk, rises from the garden to the right of the cottage out of its ring of grey stones, its broad leaves reaching up out of the frame, morning mist drifting around them. {name} stands at the garden gate looking up, {possessive} mouth open in wonder, golden dawn light on {possessive} face."
subject_action = "seen small in the frame for scale, standing at the gate with {possessive} head thrown back, looking up at the vast beanstalk rising out of the top of the image"
