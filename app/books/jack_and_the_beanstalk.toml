# Jack and the Beanstalk — the story seed.
#
# The child is the star: {name} is the boy of the tale, dressed in the visitor's
# own outfit. The words are the PDF's; the scene fields are the image model's;
# they live side by side so a page cannot contradict itself. Twenty pages, one
# cover.
#
# A plate is painted from this file, so every `environment` and every `camera`
# describes the empty stage: no person is in it, and nothing a person carries is
# either. The living things that stand still in a place — Milky-White in the
# yard and on the road, the hen on her perch, the harp beside it — are drawn
# into the plate in the one look the props and places give them. They are never
# cast slots: a slot is for a character who can be given a photograph, and the
# cow, the hen and the harp cannot.
#
# A finished page is drawn from the same block. Where the empty stage and the
# finished picture need different framing — the child's size in the frame, the
# light on a face — the page carries a `[pages.compose]` table, and the page
# prompt reads those lines instead of the plate's. This file is the only place
# a page's words or scene are written; the app loads it into the database at
# boot and every book pins the revision it was made from.


[story]
key = "jack_and_the_beanstalk"
title = "Jack and the Beanstalk"
blurb = "A cow, five magic beans, and a castle above the clouds."
book_title = "{name} and the Beanstalk"
star = "jack"
available = true

# The name a blank name field resolves to, by the photo-gender answer.
[story.names]
boy = "Jack"
girl = "Jane"

# The cover is full-bleed art under a title lockup. The top band is kept calm so
# real text can sit there; the plate check refuses a busy band at approval time.
[cover]
title_band = "calm"
cast = ["jack"]
caption = "The cover of a picture book: the child stands in the cottage garden in the foreground, full of wonder and courage, looking up at the towering green beanstalk that rises beside the little cottage, climbs out of the frame and disappears into the clouds. The beanstalk is the unmistakable hero of the composition."
subject_action = "standing in the garden in the foreground, looking up at the beanstalk, full of wonder and courage, hands loose at the sides"
environment = "the cottage garden as fixed in the props and places: the little thatched cottage on the left, the beanstalk rising from its ring of grey stones on the right and climbing into a soft bank of low cloud that hides its top just below the upper fifth of the frame, the picket fence and gate, green fields beyond, a wide clear sky"
time_of_day = "a bright morning, warm golden light from the left, a pale blue sky"
camera = "wide storybook shot at a child's height from the garden, the empty path in the lower foreground leading in, the beanstalk rising on the right, the upper third of the frame calm and open"
must_include = ["{name} in the garden looking up at the beanstalk", "the towering beanstalk rising into the low cloud with broad leaves", "the little cottage with its golden thatched roof and blue-green door", "the garden gate and the ring of grey stones", "the upper third calm and uncluttered"]
must_avoid = ["lettering, a title, a logo or a caption of any kind", "a face in the title band", "any other person", "the giant", "Milky-White the cow", "the hen or the harp"]

# The cow, the hen and the harp are not here: they cannot be given a photograph,
# so they belong to the places — the plate paints them, and the props and places
# sheet in prompts.toml ([stories.jack_and_the_beanstalk].page_world) fixes how
# they look on a finished page.

# The character bible: the single source of every look (T4.3). Each entry is
# its label, whether a photograph may be attached, the look a page uses when
# there is no photograph, the look it uses when there is one, and the brief
# the portrait pass draws a photographed cast member from. The star wears the
# visitor's own outfit in this tale, so it has no costume.

[cast.jack]
label = "The child"
photoable = true
look = "The child in this book: {Possessive} own face, hair, skin and age in every picture, exactly as in the approved portrait and photograph, and never a different child. There is no story costume: {subject} wears the visitor's own outfit from the book, garment for garment, identical on every page — every item of it drawn whenever that part of the body is in view, and no item added, dropped, swapped, restyled or recoloured. {name} is a child throughout: childlike head-to-body proportions, a round young face, short limbs, and no adult or teenage features."

[cast.mother]
label = "Mother"
photoable = true
look = "The mother (no reference photo, so this is her one look on every page): a woman in her mid-thirties, older and clearly taller than the child, with her own distinct face — an oval face with high cheekbones, warm hazel eyes, straight dark brows, a gentle smile line at each corner of her mouth and a light dusting of freckles — and dark brown hair fully tucked under a plain cream linen kerchief, with no loose strands. Her outfit, identical on every page: a long plain dark-brown wool dress with sleeves to the wrist, a light linen apron tied at the waist, and brown leather shoes. She stays the same age on every page. Her face is entirely unlike the child's; she is never a generic storybook mother."
look_with_photo = "The mother (she has reference images, named below): the woman in her reference images, older and clearly taller than the child. Her face, bone structure, eye colour, smile, skin tone and hair come exactly from her cartoon portrait — never a generic storybook mother — and she stays the same age on every page. Any head covering or glasses in her portrait are worn on every page exactly as there, covering her hair just as fully. Her outfit, identical on every page: a long plain dark-brown wool dress with sleeves to the wrist, a light linen apron tied at the waist, and brown leather shoes. Her face is never the child's."
portrait = "THE CHARACTER: the woman in the photograph, as the mother in this picture book. Her face, bone structure, eye colour, smile, skin tone, hair and apparent age exactly as in the photograph — never a generic storybook mother. Any head covering or glasses she wears in the photograph stay, with the same shape, colour and pattern, worn the same way. She wears her costume from the book: a long plain dark-brown wool dress and a light linen apron."

[cast.old_man]
label = "Old man"
photoable = true
look = "The old man (no reference photo, so this is his one look on every page): a kindly, grandfatherly traveller in his seventies, with a broad warm face, smiling eyes with deep crow's feet, rosy cheeks, a round nose and a full, bushy, curly white beard down to his chest. He wears a wide-brimmed brown felt hat with a dark band, a long worn grey-green travelling cloak over a brown tunic, a small leather pack on two straps on his back, and scuffed brown boots — identical on every page. He is grandfatherly, never elfin and never sinister. His face is entirely unlike the child's and the giant's."
look_with_photo = "The old man (he has reference images, named below): the man in his reference images, as a kindly, grandfatherly traveller. His face, eyes, skin tone and his beard — its colour, fullness, length and curl — come exactly from his cartoon portrait, keeping his warm expression and the smile in his eyes. If his portrait shows a hat, his hat in the story keeps that hat's silhouette, brim width and colour, adapted to the tale (a modern brimmed hat becomes a period felt hat with the same brim and band, never a pointed or floppy hat); glasses in his portrait stay on. His costume, identical on every page: a long worn grey-green travelling cloak over a brown tunic, a small leather pack on two straps on his back, and scuffed brown boots. His face is never the child's or the giant's."
portrait = "THE CHARACTER: the man in the photograph, as the kindly old traveller in this picture book. His face, eyes, skin tone, apparent age and his beard — its colour, fullness, length and curl — exactly as in the photograph, with a warm expression and smiling eyes. If he wears a hat in the photograph, it becomes a period felt hat with the same silhouette, brim width and colour; glasses stay. He wears his costume from the book: a long worn grey-green travelling cloak over a brown tunic."

[cast.giant]
label = "Giant"
photoable = true
look = "The giant (no reference photo, so this is his one look on every page): an enormous man in his forties, so big that the child would barely reach his knee, with a wide square face, a broad flat nose, small deep-set dark eyes under thick black eyebrows, a bald head with a black fringe of hair at the back, and a short, thick black beard — the same black beard on every page. He wears a rough brown sackcloth tunic, a wide leather belt with an iron buckle, dark trousers and huge laced boots. He is not the old man: a different age, a different face, a different beard colour and a different build. His face is entirely unlike the child's."
look_with_photo = "The giant (he has reference images, named below): the man in his reference images, drawn as a giant so big that the child would barely reach his knee. His face, eyes, skin tone, hair and beard — its colour and shape — come exactly from his cartoon portrait and stay the same on every page. His costume, identical on every page: a rough brown sackcloth tunic, a wide leather belt with an iron buckle, dark trousers and huge laced boots. His face is never the child's or the old man's."
portrait = "THE CHARACTER: the man in the photograph, as the giant in this picture book: broad, heavy-set and huge-shouldered. His face, eyes, skin tone, hair, apparent age and beard exactly as in the photograph. He wears his costume from the book: a rough brown sackcloth tunic with a wide leather belt."

