caption = "{name} climbed and climbed, up into the clouds. {name} climbs the enormous green beanstalk, both hands gripping the thick stem, one boot braced on a broad curling leaf, far above the little cottage, which is now only a tiny speck far below. White clouds drift around the stalk, and a break in them shows a bright light overhead."
subject_action = "mid-climb on the great beanstalk, both hands gripping the thick green stem with fingers wrapped round it, one foot on a broad leaf, {possessive} face lifted towards the clouds above"
