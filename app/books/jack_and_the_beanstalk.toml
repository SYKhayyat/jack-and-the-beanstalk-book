# --- twenty pages -----------------------------------------------------------

[[pages]]
key = "empty-cupboard"
title = "The empty cupboard"
cast = ["mother"]
caption = "{name} and {possessive} mother had nothing left to sell but their cow, Milky-White. Inside the cottage kitchen, {name} stands beside {possessive} worried mother at the worn oak table, looking up at her face, while she twists her apron in her hands. On the back wall the open shelves are nearly empty and the cupboard stands open with nothing inside. Through the open cottage door Milky-White waits in the yard."
subject_action = "standing beside {possessive} mother at the table, {name}'s face fully towards the camera and front-lit, {possessive} eyes on {possessive} mother's face"
environment = "the cottage kitchen as fixed in the props and places: the hearth with its copper pots on the left, the worn oak table and two stools in the middle, the nearly-empty shelves and the open, empty cupboard on the back wall, soft daylight from the window on the right, and the cottage door standing open onto the yard, where Milky-White the plain white cow stands at the picket fence — the same white cow wherever a place names her"
time_of_day = "bright morning, soft daylight from the window on the right, warm and clear"
camera = "eye-level medium shot at table height across the kitchen, the worn oak table and the clear floor beside it in the middle of the frame, the door in the middle of the back wall behind the table"
must_include = ["{name}'s face front-lit and fully visible", "{possessive} mother beside the table", "the nearly-empty shelves and the open, empty cupboard", "Milky-White the same white cow, plainly visible through the open door", "the child's figure keeps a natural head-to-body ratio"]
must_avoid = ["anything written on the pages or walls", "an open book or letter with visible letters", "the mother pushing {name} or looking angry", "extra children or extra cows", "the old man — he has not arrived in this story yet", "beans or any glowing object — none have been given yet"]
story = "Once upon a time, {name} lived in a little stone cottage at the end of a lane, with {possessive} mother. They were very poor. The shelves were bare and the cupboard was empty. All they had left was their good white cow, Milky-White. “Tomorrow,” sighed {possessive} mother, “you must take her to market and sell her, or we shall have no bread.”"
beat = "{name} and {possessive} mother have nothing left to sell but the white cow, Milky-White."
emotion = "quiet worry: the mother anxious and tired, her brows drawn together; {name} sad and concerned, looking up at her"

[pages.compose]
environment = "the cottage kitchen as fixed in the props and places: the hearth with its copper pots on the left, the worn oak table and two stools in the middle, the nearly-empty shelves and the open, empty cupboard on the back wall, soft daylight from the window on the right, and the cottage door open onto the yard where Milky-White stands, clearly visible"
time_of_day = "bright morning, soft daylight from the window falling on {name}'s face"
camera = "eye-level medium shot at table height, both faces clearly readable, the cow framed through the open door behind them"

[[pages]]
key = "the-trade"
title = "The trade"
cast = ["old_man"]
caption = "Five beans, said the old man, for one cow. On the dirt road to market, {name} walks towards the right of the frame holding Milky-White's rope, when a kindly old man steps out from the hedgerow ahead on the right to meet {object}. He holds out his open palm with exactly five beans lying on it — five and only five: one speckled red, one blue-grey, one deep green, one golden-tan, one dark violet, real seeds with mottled skins and no glow. His palm holds nothing else: not four beans, not six, no sixth bean anywhere."
subject_action = "three-quarter view from behind one shoulder, {name} leaning forward to look into the old man's open palm, holding the cow's rope in one hand, the fingers wrapped round it"
environment = "a dusty dirt road leading away to the right through green fields towards the far-off market, a hedgerow beside the road, low stone walls, a few round trees, puffy clouds, and Milky-White the plain white cow standing at the left of the road, drawn as part of the road — the same white cow as in the yard"
time_of_day = "late morning, clear sky, the light gentle"
camera = "three-quarter medium shot from beside the road at a child's eye height, the hedgerow crossing the middle ground ahead on the right, the dirt road running away to the right"
must_include = ["exactly five beans in the old man's open palm — five and only five, one speckled red, one blue-grey, one deep green, one golden-tan, one dark violet, no sixth bean and no extra bean of any colour", "{name} holding the cow's rope", "a dirt road to market", "the old man's friendly face, drawn to his cast description", "the child's figure keeps a natural head-to-body ratio"]
must_avoid = ["a sixth bean, or any number of beans other than exactly five", "beans hidden in a bag, a pouch or a closed fist instead of lying in the open palm", "the old man grabbing the rope or the cow", "money or coins changing hands", "a blade or weapon", "extra people on the road"]
story = "So {name} set off down the road to market, leading Milky-White by her rope. Halfway there, a kindly old man stepped out from behind the fence. “That is a fine cow,” he said. “I will give you five beans for her.” He opened his hand. In it lay five beans: one red, one blue, one green, one gold, one violet. {name} had never seen beans like them. {name} looked at them for a long time. Then {subject} said yes."
beat = "An old man offers {name} five beans in exchange for the cow."
emotion = "curious temptation: {name} leaning in, eyes wide and fascinated by the beans; the old man warm and twinkling, smiling with his eyes"

[pages.compose]
environment = "a dusty dirt road leading to the right through green fields towards the market, a hedgerow beside the road, low stone walls, a few round trees, puffy clouds, Milky-White's head at the left edge of the frame waiting patiently — the same plain white cow, unchanged"
camera = "over-the-shoulder three-quarter medium close shot centred on the old man's outstretched palm of beans, {name}'s profile strong and readable"

[[pages]]
key = "beans-out-the-window"
title = "Out the window"
cast = ["mother"]
caption = "Beans! she cried. And out the window they went. At dusk, {name}'s mother leans out of the cottage window and throws the five beans down into the garden — one speckled red, one blue-grey, one deep green, one golden-tan, one dark violet, five in all and no sixth — dull seeds in her hand with no glow and no light of their own. {name} stands at the open doorway to the right of the window, watching them go."
subject_action = "standing in the open doorway, one hand on the door frame, {name}'s face turned towards the window watching the beans fall into the garden"
environment = "the front of the cottage as fixed in the props and places, at dusk: the lit square window to the left of the blue-green door, the stone doorstep, the dark vegetable garden in front, the picket fence and gate, the sky deep blue-violet with a band of sunset orange at the horizon"
time_of_day = "dusk, a much darker palette than the morning pages: deep blue and violet shadows, warm lamplight from the window"
camera = "wide shot of the whole cottage front from the garden, the lit window and the blue-green door both readable in the middle of the frame, the wide dark garden in the foreground"
must_include = ["exactly five beans falling in an arc towards the garden, five and only five, each one separately visible and countable — speckled red, blue-grey, deep green, golden-tan and dark violet — none missing, no sixth bean and no extra bean", "the mother leaning out of the lit window throwing beans", "{name} standing small in the open doorway in true proportion to the cottage", "the child's figure drawn with a natural head-to-body ratio", "a much darker, duskier palette than the earlier pages"]
must_avoid = ["a sixth bean, or any number of beans other than exactly five", "the beans glowing, sparkling or lit from inside", "beans hanging still in the air", "an enlarged head, oversized face or close-up of {name}", "the mother also standing in the doorway", "the beans already sprouted or growing", "a giant watching the house", "any pets or extra children in the garden", "Milky-White the cow — she was already sold, and she is nowhere in this scene"]
story = "When {name} came home with five beans and no cow, {possessive} mother could hardly believe her ears. “Beans?” she cried. “You sold our cow for a handful of beans?” She turned them over in her hand. Beans were beans, and beans were worth nothing at all. Out of the window they went, tumbling into the dark garden. And {name} went to bed that night without any supper at all."
beat = "{name}'s mother throws the five beans out of the cottage window."
emotion = "exasperation and dismay: the mother cross and despairing as she flings the beans, never violent; {name} dismayed, mouth open, watching them go"

[pages.compose]
environment = "the front of the cottage as fixed in the props and places, at dusk: the lit square window to the left of the door with the mother leaning out of it, the open blue-green door with {name} in it, the stone doorstep, the dark vegetable garden in front, the sky deep blue-violet with a band of sunset orange at the horizon"
time_of_day = "dusk, a much darker palette than the morning pages: deep blue and violet shadows, warm lamplight from the window, the beans dark and dull as they fall"
camera = "wide shot showing the whole cottage front from the garden, the lit window and the doorway both readable; {name} stands in the open doorway — small, roughly a quarter of the frame height, in true proportion to the cottage — never scaled up towards the camera"

