must_include = ["the giant beanstalk, thicker than the cottage door, rising out of frame with broad leaves", "{name} tiny at the gate in true proportion to the beanstalk, looking up in wonder", "the cottage beside the beanstalk", "the child's tiny figure keeps a natural head-to-body ratio", "warm sunrise light"]
must_avoid = ["an enlarged head, oversized face or close-up of {name}", "the giant himself", "a fully visible sky castle", "the beanstalk toppling or broken", "a beanstalk thinner than a tree trunk", "any writing on the leaves or sky"]
story = "But when {name} woke at sunrise, the garden was not the same. Where the beans had fallen, a great beanstalk had grown up in the night. It was as thick as an old tree. It climbed past the roof, past the birds, and up and away into the clouds. {name} ran out to the gate and stared with wide eyes."
beat = "Overnight the five beans have grown into a beanstalk that reaches the clouds."
emotion = "pure wonder: {name} wide-eyed in amazement, mouth open, head tipped right back"

[pages.compose]
environment = "the cottage garden at dawn as fixed in the props and places: the little thatched cottage on the left, the beanstalk rising from its stone ring on the right of it, the picket fence and gate in front, the night still fading low behind the hills"
