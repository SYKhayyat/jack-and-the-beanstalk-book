cast = ["mother"]
story = "The morning was bright when {name} set out. {Possessive} mother packed a basket with bread, honey and a little cake. They were for Grandmother, who lived on the other side of the wood. {name} put on {possessive} red hood and took the basket by the handle. 'Go straight there,' said {possessive} mother. 'Do not stop to talk to anyone.'"
beat = "{name}'s mother packs a basket for Grandmother and warns {object} to go straight there."
emotion = "warm care: the mother serious and loving, {name} listening with the basket in both hands"
caption = "In a warm cottage kitchen in the morning, {name}'s mother ties the red hood at {possessive} throat and sets a covered basket in {possessive} hands: bread, a jar of honey and a little cake for Grandmother. The mother leans down, one hand on {name}'s shoulder, her face loving and serious. The same cottage kitchen as the rest of the book: stone hearth on the left, worn oak table in the middle, shelves and cupboard behind."
subject_action = "standing by the table holding the basket with both hands while {possessive} mother ties the red hood, looking up at her"
environment = "the cottage kitchen: a stone hearth with copper pots on the left wall, a worn oak table with two stools in the middle, open shelves and a cupboard on the back wall, a window on the right wall, morning light"
time_of_day = "early morning, clear soft daylight through the window, a low fire in the hearth"
camera = "eye-level medium shot across the kitchen from the window side, the table and the clear floor beside it in the middle of the frame"
must_include = ["{name} in the red hood with the covered basket", "the mother tying the hood or resting a hand on {name}'s shoulder", "the covered basket with bread, a honey jar and a little cake visible", "the same cottage kitchen on every page", "the child's figure keeps a natural head-to-body ratio"]
