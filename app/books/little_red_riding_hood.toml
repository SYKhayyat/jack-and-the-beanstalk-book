# Little Red Riding Hood — the story seed.
#
# The child is the star: {name} wears the red hood and carries the basket. The
# words are the PDF's; the scene fields are the image model's; they live side by
# side so a page cannot contradict itself. Twenty pages, one cover.
#
# The wolf is sly, never gory. Nobody is bitten, cut or killed: Grandmother is
# shut in the cupboard, the rescue is a shout, and the wolf runs away.

[story]
key = "little_red_riding_hood"
title = "Little Red Riding Hood"
blurb = "A basket for Grandmother, a path through the wood, and a wolf."
book_title = "{name} and the Wolf"
star = "red"
available = true

# The cover is full-bleed art under a title lockup. The top band is kept calm so
# real text can sit there; T1's check refuses a busy plate at approval time.
[cover]
title_band = "calm"
cast = ["red", "wolf"]
caption = "The cover of a picture book: the child in the red hood stands on a winding path at the edge of a tall green wood, holding a covered basket, looking back over one shoulder. Far behind the trees, a grey wolf in a dark green coat watches from the shadows. Beyond the trees, a small cottage with a blue door sends a curl of smoke into a calm sky."
subject_action = "standing on the path with the basket on one arm, turning to look back at the trees, calm and curious"
environment = "the edge of the wood: a winding dirt path, tall trees with deep green leaves, a small stone cottage with a blue door and a curl of smoke in the distance, open sky above"
time_of_day = "early morning, soft golden light from the left, a pale blue sky"
camera = "wide storybook shot at a child's height, the open path in the lower right of the frame, the wood rising behind and open sky above"
must_include = ["{name} in the red hood with the covered basket", "the winding path into the tall wood", "the small cottage with the blue door and its curl of smoke", "the grey wolf in the green coat, far away between the trees", "the upper third calm and uncluttered"]
must_avoid = ["lettering, a title, a logo or a caption of any kind", "the wolf close to the child or showing teeth", "any other person", "a face in the title band", "a weapon", "blood"]

# The character bible. The star's face comes from the upload; the red cloak is
# the story's costume, fixed on every page.
[cast]
red = "The child in the red hood: the starred child's own face, hair, skin and age on every page, exactly as in the approved portrait and photograph. The costume, identical on every page: a bright red hooded cloak with the hood up and tied at the throat with a small bow, over a plain cream woollen dress, a white linen apron, brown leather shoes, and a woven brown basket on one arm. The red cloak is the story's dress, never a new face."
mother = "The mother (no reference photo, so this is her one look on every page): a woman in her mid-thirties, clearly taller than the child, with an oval face, warm hazel eyes, straight dark brows and dark brown hair tucked under a plain cream linen kerchief. Her outfit, identical on every page: a long plain dark-brown wool dress with sleeves to the wrist, a light linen apron tied at the waist, and brown leather shoes. Her face is entirely unlike the child's."
grandmother = "Grandmother (no reference photo, so this is her one look on every page): a small, gentle woman in her seventies, with a soft round face, warm brown eyes, white hair in a neat bun, small round spectacles, a white lace cap, a soft lavender shawl over a plain grey dress, and dark soft shoes. She is warm and quick to smile, never frail or frightening, and her face is entirely unlike the child's and the mother's."
woodcutter = "The woodcutter (no reference photo, so this is his one look on every page): a tall, broad man in his forties with a kind weathered face, warm brown eyes, a short brown beard and sawdust on his sleeves. His outfit, identical on every page: a green woollen shirt, brown trousers, a leather apron and heavy brown boots. He carries no weapon on any page; his axe stays in the wood, out of frame. His face is entirely unlike the child's."
wolf = "The wolf (no reference photo, so this is his one look on every page): a tall grey wolf who walks on two legs and talks. He wears a smart dark-green coat, a cream waistcoat, a brown neckerchief and black boots. His fur is grey with a pale muzzle, his eyes are amber, and his tail is long and bushy. He is sly and greedy, never a monster: he never bites, scratches or harms anyone on the page, and no page shows blood, a wound or a weapon."

[cast_photoable]
red = true
mother = true
grandmother = true
woodcutter = true
wolf = false

[cast_labels]
red = "The child"
mother = "Mother"
grandmother = "Grandmother"
woodcutter = "Woodcutter"
wolf = "The wolf"

# Story words this tale needs beyond the shared simple vocabulary. Proper nouns
# are allowed here; anything else should be a word a six-year-old knows.
[vocabulary]
allow = ["grandmother", "woodcutter", "wolf", "red", "honey", "lane", "lantern", "shawl", "cupboard", "wilted"]

# --- twenty pages -----------------------------------------------------------

[[pages]]
