[project]
name = "jack-and-the-beanstalk"
version = "1.0.0"
description = "Upload a photo, cartoonify it, and place the cartoon you into a Jack and the Beanstalk scene."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RET",  # return handling
  "ARG",  # unused arguments
  "PTH",  # prefer pathlib
  "C4",   # comprehensions
  "RUF",  # ruff-specific
]
ignore = [
  "B008",  # FastAPI's Depends/File/Form defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["PIL.*", "google.*", "jinja2.*", "uharfbuzz", "fpdf.*", "pydantic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85