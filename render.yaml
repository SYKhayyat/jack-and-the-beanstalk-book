# Render blueprint.
#
# `sync: false` means Render creates the variable in the dashboard and prompts
# you to paste the value. That is the whole point: the key never passes through
# this file, never lands in git, and never appears in a build log.
#
# Deploy with:  render blueprint launch   (or push and use "New > Blueprint")

services:
  - type: web
    name: jack-and-the-beanstalk-book
    # Docker runtime, not the native python one: the Dockerfile installs the
    # system libstdc++ that uharfbuzz (Hebrew PDF text shaping) needs.
    runtime: docker
    plan: free
    region: oregon

    healthCheckPath: /healthz

    # Custom domain: book.siachshai.online (add manually in Render dashboard → Settings → Custom Domains)
    # Cloudflare DNS: CNAME book → <render-target>.onrender.com (proxied)

    envVars:
      - key: APP_ENV
        value: production

      # IMAGE_PROVIDER is deliberately not declared here. The app boots on the
      # mock provider without it, and keeping the dashboard as the single
      # source of truth means switching to openai in the dashboard is never
      # overwritten by the next blueprint sync. Add OPENAI_API_KEY below (or
      # AGNES_API_KEY, or GEMINI_API_KEY) and set IMAGE_PROVIDER in the
      # dashboard env.

      # Paste your key into the Render dashboard when prompted.
      - key: OPENAI_API_KEY
        sync: false

      # The free provider that accepts the uploaded photo as a reference image.
      - key: AGNES_API_KEY
        sync: false

      # Defaults to mock in the app; set to "openai", "agnes" or "gemini" in
      # the dashboard once a key is in place.
      - key: IMAGE_PROVIDER
        sync: false

      # Only for IMAGE_PROVIDER=gemini (images need billing, no free tier).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite-image

      # Agnes, the free provider that takes the photo. The free tier is rate
      # limited by resolution, so 1K is the tier that fits a whole book.
      - key: AGNES_MODEL
        value: agnes-image-2.5-flash
      - key: AGNES_SIZE
        value: 1K
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1

      # The picture reviewer. gpt-6-luna uses OPENAI_API_KEY, so there is no
      # second key to paste. The Gemini free tier ran out of daily quota
      # mid-book, which is why it is no longer the default.
      - key: REVIEWER_PROVIDER
        value: openai
      - key: REVIEWER_MODEL
        value: gpt-6-luna
      # Only read when REVIEWER_PROVIDER=gemini (empty falls back to GEMINI_API_KEY).
      - key: REVIEWER_API_KEY
        sync: false
      - key: REVIEWER_TIMEOUT_SECONDS
        value: "90"
      # Measured price of one review (a picture plus its plate); feeds the
      # cost ledger.
      - key: REVIEW_CALL_COST_USD
        value: "0.0011"
      # Empty prices images from the provider's published table, so it is not
      # declared; set it in the dashboard for a model that table does not know.
      - key: IMAGE_CALL_COST_USD
        sync: false

      # The decision judge: a first look at every picture on OpenAI's
      # Decisions API, so confident passes and fails skip the reviewer call.
      - key: DECISION_JUDGE
        value: "true"
      - key: DECISION_JUDGE_MODEL
        value: gpt-6-luna
      - key: DECISION_JUDGE_USD_PER_MILLION_TOKENS
        value: "0.10"

      # Billable tries per page before the best one is kept.
      - key: PAGE_ATTEMPTS
        value: "3"

      # The shared password in front of the app. LOCAL DEVELOPMENT ONLY:
      # once the Google client below is set, the password is switched off and
      # Google sign-in is the only way in. Leaving both unset makes the app
      # open to anyone who finds the URL, and every generation costs money.
      - key: APP_PASSWORD
        sync: false

      # Google sign-in. With both of these set, Google is the only way in and
      # every visitor's books are theirs alone. Create the client in the
      # Google Cloud console — docs/google-oauth-setup.md has the click-by-
      # click walkthrough, including the consent-screen gotcha that hard-expires
      # a grader's session after seven days if it is left in "Testing" mode.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must match the redirect URI registered in the console exactly.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Who may open /admin: Google sub values or emails, comma separated.
      # Empty disables the admin screens. An email, so it stays out of git.
      - key: OPERATOR_SUB
        sync: false
      # Signs the session cookie. Set it, or every restart signs everyone out.
      - key: SESSION_SECRET
        sync: false
      - key: APP_SESSION_MAX_AGE_DAYS
        value: "7"
      - key: APP_LOGIN_MAX_ATTEMPTS
        value: "8"

      # Cheapest configuration OpenAI publishes: ~$0.0059 per image call.
      - key: OPENAI_MODEL
        value: gpt-image-2.5-flare
      - key: OPENAI_QUALITY
        value: low

      - key: MAX_UPLOAD_MB
        value: "10"

      # One budget per request, covering queueing and both model calls.
      - key: GENERATION_TIMEOUT_SECONDS
        value: "600"

      # Admission control. Beyond this, requests queue and then get 429 rather
      # than fanning out into more billable calls. 8 ran the 512 MB instance
      # out of memory on 2026-11-10, before 79a0206 stopped holding every page
      # until the PDF and put full-size decodes behind two shared slots; 4 was
      # the safe floor after that. Back at 8 on trial (2026-11-11): watch the
      # memory graph on the next book and drop to 6 if it nears 512 MB.
      - key: MAX_CONCURRENT_GENERATIONS
        value: "8"

      # One book's pages in flight at once, and the threads for their image
      # work. Run 2 (2026-11-11) had all 21 pages in flight on a tenth of a
      # CPU; the health check took 20 s and the instance was restarted.
      - key: BOOK_PAGE_CONCURRENCY
        value: "6"
      - key: IMAGE_WORK_THREADS
        value: "2"

      # A restart picks an interrupted book up again: twice at most, and
      # only within an hour of its job starting.
      - key: BOOK_MAX_RESUMES
        value: "2"
      - key: BOOK_RESUME_WINDOW_MINUTES
        value: "60"

      # Per-client abuse brake. A book charges one per picture up front, so keep
      # this well above a book's size; OPENAI_IMAGES_PER_MINUTE is the real cap.
      - key: MAX_GENERATIONS_PER_MINUTE
        value: "200"

      # OpenAI's image limit is 20 a minute; calls wait here instead of 429ing.
      - key: OPENAI_IMAGES_PER_MINUTE
        value: "18"

      # A picture drawn on request — a portrait, a redraw, a replaced face —
      # costs 15¢ from the wallet as it is drawn. The book's own 22 pictures are
      # inside its 99¢ fee.
      - key: PICTURE_PRICE_CENTS
        value: "15"

      # A book whose measured model spend passes a dollar is named on
      # /admin/status and writes one book.cost_alert line (C4).
      - key: BOOK_COST_ALERT_CENTS
        value: "100"
      # 0 keeps the reviewer for the whole book; 100 rests it once the book has
      # spent its 99¢ fee, with tier 1 and the decision judge still deciding.
      - key: REVIEWER_BUDGET_PERCENT
        value: "0"
      # Past 1.2× the fee, a page that did not pass is not drawn again — it
      # keeps the best picture it has and the book still finishes. Run 1
      # (2026-11-11) spent $1.58 a book against the 99¢ price, $0.94 of it
      # redraws; the ceiling is what stops one bad page from eating a book's
      # margin. 0 turns it off.
      - key: BOOK_RETRY_BUDGET_PERCENT
        value: "120"

      - key: STORAGE_DIR
        value: /tmp/jack-and-the-beanstalk-book-storage

      # Retention: unfinished drafts, and finished books, are deleted after this.
      - key: DRAFT_RETENTION_HOURS
        value: "24"
      - key: BOOK_RETENTION_DAYS
        value: "7"

      # Stripe sandbox secret key (sk_test_...). Set it and wallets turn on:
      # top-ups through Stripe's hosted checkout, 99¢ per finished book, and
      # refunds back to the card. Leave it unset and books are free. It is a
      # bearer credential, so it is pasted into the dashboard and never
      # committed.
      - key: STRIPE_SECRET_KEY
        sync: false

      # The one mail this app sends — "your book is ready" — through Resend
      # (W2). Both are needed: the key to send, the From address to send as
      # (its domain must be verified in Resend). Leave either unset and no mail
      # is sent; the book is finished and downloadable either way.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Absolute address of this site, for the link in that mail. Unset sends
      # it without a link. Use the custom domain, not the onrender.com one.
      - key: PUBLIC_SITE_URL
        sync: false

      # The printed book. `mock` is the hand-in default: the whole review,
      # approve, address and order flow works, and the order page says plainly
      # that nothing will be printed. `peecho` places the same order in Peecho's
      # TEST environment once the three credentials below are set; there is no
      # live provider in this app, on purpose.
      - key: PRINT_PROVIDER
        value: "mock"
      - key: PRINT_RETAIL_CENTS
        value: "2499"
      - key: PUBLISHER_NAME
        value: "Storybook Studio"
      # Peecho test-environment credentials (test.www.peecho.com). Leave unset
      # while PRINT_PROVIDER=mock. These are bearer credentials: dashboard only.
      - key: PEECHO_API_KEY
        sync: false
      # Signs the payment call that confirms the order. Without it an order
      # stays a draft and nothing is printed, so Peecho needs all four.
      - key: PEECHO_SECRET_KEY
        sync: false
      - key: PEECHO_OFFERING_ID
        sync: false
      - key: PEECHO_CONTACT_EMAIL
        sync: false

      # The print provider's wholesale assumptions, in cents. The defaults are
      # Peecho's published softcover base and per-page rate plus a standard
      # shipping example; the business write-up prices the same numbers.
      - key: PRINT_BASE_COST_CENTS
        value: "378"
      - key: PRINT_PER_PAGE_COST_CENTS
        value: "17"
      - key: PRINT_SHIPPING_CENTS
        value: "637"

      # The Postgres URL (Neon's pooled connection string). Set it and books,
      # pages, PDFs, signed-in people and the story templates survive restarts.
      # Leave it unset and the app uses a SQLite file on Render's ephemeral
      # disk, which a restart erases. It embeds the database password, so it is
      # pasted into the dashboard and never committed. The app migrates the
      # database itself on boot; `make migrate` is only for applying a deploy's
      # migrations ahead of time.
      - key: DATABASE_URL
        sync: false

      # Cloudflare R2: pictures and PDFs live here, the database keeps only
      # pointers. All four, or the blobs stay inline in Postgres.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
