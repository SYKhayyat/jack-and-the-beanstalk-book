# Render blueprint.
#
# `sync: false` means Render creates the variable in the dashboard and prompts
# you to paste the value. That is the whole point: the key never passes through
# this file, never lands in git, and never appears in a build log.
#
# Deploy with:  render blueprint launch   (or push and use "New > Blueprint")

services:
  - type: web
    name: jack-and-the-beanstalk-book
    # Docker runtime, not the native python one: the Dockerfile installs the
    # system libstdc++ that uharfbuzz (Hebrew PDF text shaping) needs.
    runtime: docker
    plan: free
    region: oregon

    healthCheckPath: /healthz

    # Custom domain: book.siachshai.online (add manually in Render dashboard → Settings → Custom Domains)
    # Cloudflare DNS: CNAME book → <render-target>.onrender.com (proxied)

    envVars:
      - key: APP_ENV
        value: production

      # IMAGE_PROVIDER is deliberately not declared here. The app boots on the
      # mock provider without it, and keeping the dashboard as the single
      # source of truth means switching to openai in the dashboard is never
      # overwritten by the next blueprint sync. Add OPENAI_API_KEY below (or
      # AGNES_API_KEY, or GEMINI_API_KEY) and set IMAGE_PROVIDER in the
      # dashboard env.

      # Paste your key into the Render dashboard when prompted.
      - key: OPENAI_API_KEY
        sync: false

      # The free provider that accepts the uploaded photo as a reference image.
      - key: AGNES_API_KEY
        sync: false

      # Defaults to mock in the app; set to "openai", "agnes" or "gemini" in
      # the dashboard once a key is in place.
      - key: IMAGE_PROVIDER
        sync: false

      # Only for IMAGE_PROVIDER=gemini (images need billing, no free tier).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite-image

      # Agnes, the free provider that takes the photo. The free tier is rate
      # limited by resolution, so 1K is the tier that fits a whole book.
      - key: AGNES_MODEL
        value: agnes-image-2.5-flash
      - key: AGNES_SIZE
        value: 1K
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1

      # The picture reviewer. gpt-6-luna uses OPENAI_API_KEY, so there is no
      # second key to paste. The Gemini free tier ran out of daily quota
      # mid-book, which is why it is no longer the default.
      - key: REVIEWER_PROVIDER
        value: openai
      - key: REVIEWER_MODEL
        value: gpt-6-luna
      # Only read when REVIEWER_PROVIDER=gemini (empty falls back to GEMINI_API_KEY).
      - key: REVIEWER_API_KEY
        sync: false
      - key: REVIEWER_TIMEOUT_SECONDS
        value: "90"
      # Measured price of one review (a picture plus its plate); feeds the
      # cost ledger.
      - key: REVIEW_CALL_COST_USD
        value: "0.0011"
      # Empty prices images from the provider's published table, so it is not
      # declared; set it in the dashboard for a model that table does not know.
      - key: IMAGE_CALL_COST_USD
        sync: false

      # The decision judge: a first look at every picture on OpenAI's
      # Decisions API, so confident passes and fails skip the reviewer call.
      - key: DECISION_JUDGE
        value: "true"
      - key: DECISION_JUDGE_MODEL
        value: gpt-6-luna
      - key: DECISION_JUDGE_USD_PER_MILLION_TOKENS
        value: "0.10"

      # Billable tries per page before the best one is kept.
      - key: PAGE_ATTEMPTS
        value: "3"

      # The shared password in front of the app. LOCAL DEVELOPMENT ONLY:
      # once the Google client below is set, the password is switched off and
      # Google sign-in is the only way in. Leaving both unset makes the app
      # open to anyone who finds the URL, and every generation costs money.
      - key: APP_PASSWORD
        sync: false

      # Google sign-in. With both of these set, Google is the only way in and
      # every visitor's books are theirs alone. Create the client in the
      # Google Cloud console — docs/google-oauth-setup.md has the click-by-
      # click walkthrough, including the consent-screen gotcha that hard-expires
      # a grader's session after seven days if it is left in "Testing" mode.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must match the redirect URI registered in the console exactly.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Who may open /admin: Google sub values or emails, comma separated.
      # Empty disables the admin screens. An email, so it stays out of git.
      - key: OPERATOR_SUB
        sync: false
      # Signs the session cookie. Set it, or every restart signs everyone out.
      - key: SESSION_SECRET
        sync: false
      - key: APP_SESSION_MAX_AGE_DAYS
        value: "7"
      - key: APP_LOGIN_MAX_ATTEMPTS
        value: "8"

      # Cheapest configuration OpenAI publishes: ~$0.0059 per image call.
      - key: OPENAI_MODEL
        value: gpt-image-2.5-flare
      - key: OPENAI_QUALITY
        value: low

      - key: MAX_UPLOAD_MB
        value: "10"

      # One budget per request, covering queueing and both model calls.
      - key: GENERATION_TIMEOUT_SECONDS
        value: "600"

      # Admission control. Beyond this, requests queue and then get 429 rather
      # than fanning out into more billable calls.
      - key: MAX_CONCURRENT_GENERATIONS
        value: "12"

      - key: MAX_GENERATIONS_PER_MINUTE
        value: "120"

      - key: STORAGE_DIR
        value: /tmp/jack-and-the-beanstalk-book-storage

      # Retention: unfinished drafts, and finished books, are deleted after this.
      - key: DRAFT_RETENTION_HOURS
        value: "24"
      - key: BOOK_RETENTION_DAYS
        value: "7"

      # Stripe sandbox secret key (sk_test_...). Set it and wallets turn on:
      # top-ups through Stripe's hosted checkout, 99¢ per finished book, and
      # refunds back to the card. Leave it unset and books are free. It is a
      # bearer credential, so it is pasted into the dashboard and never
      # committed.
      - key: STRIPE_SECRET_KEY
        sync: false

      # The Postgres URL (Neon's pooled connection string). Set it and books,
      # pages, PDFs, signed-in people and the story templates survive restarts.
      # Leave it unset and the app uses a SQLite file on Render's ephemeral
      # disk, which a restart erases. It embeds the database password, so it is
      # pasted into the dashboard and never committed. The app migrates the
      # database itself on boot; `make migrate` is only for applying a deploy's
      # migrations ahead of time.
      - key: DATABASE_URL
        sync: false
