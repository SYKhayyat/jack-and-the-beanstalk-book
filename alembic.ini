# Alembic configuration.
#
# The database URL is NOT put here (this file is committed; a URL embeds a
# password). `migrations/env.py` reads DATABASE_URL from the environment:
#
#     DATABASE_URL=postgres://... make migrate

[alembic]
script_location = migrations
prepend_sys_path = .
# Split prepend_sys_path on the platform separator, as Alembic now asks for;
# the legacy parser splits on spaces, commas and colons.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
